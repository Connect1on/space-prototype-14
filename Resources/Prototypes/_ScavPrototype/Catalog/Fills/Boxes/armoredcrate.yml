- type: entity
  id: BoxWeaponRandom
  name: укреплённый ящик
  parent: BaseStorageItem
  description: Довольно массивный ящик, что подтверждает его размер, иногда в них перевозят оружие, может стоит попытать счастье?
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_red.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_red.rsi
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,6,5
    storageOpenSound: /Audio/Items/toolbox_open.ogg
    storageCloseSound: /Audio/Items/toolbox_close.ogg
    storageInsertSound: /Audio/Items/toolbox_insert.ogg
    storageRemoveSound: /Audio/Items/toolbox_remove.ogg
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        # Random lighting item GroupSelector
        - !type:GroupSelector
          rolls: 2
          children:
          - !type:NestedSelector
            tableId: VarietyFoodAndWater
          - !type:NestedSelector
            tableId: VarietyCraftingStuff
          - !type:NestedSelector
            tableId: VarietyBaseMedical
            weight: 0.75
          - !type:NestedSelector
            tableId: VarietyWeaponScav
            weight: 0.25
          - id: SheetSteel10
