- type: entity
  id: BoxMedicalRandom
  name: медицинский ящик
  parent: BaseStorageScavSpecial
  description: Ящик перевозящий медицинские принадлежности для оказания первой помощи. Дезинфицирующие средства в комплект не входят.
  components:
  - type: Sprite
    sprite: _ScavPrototype/Objects/Structures/Furniture/box.rsi
    state: icon
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,4,4
    storageOpenSound: /Audio/Items/toolbox_open.ogg
    storageCloseSound: /Audio/Items/toolbox_close.ogg
    storageInsertSound: /Audio/Items/toolbox_insert.ogg
    storageRemoveSound: /Audio/Items/toolbox_remove.ogg
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        # Random lighting item GroupSelector
        - !type:GroupSelector
          rolls: 2
          children:
          - !type:NestedSelector
            tableId: VarietyBaseMedical
          - !type:NestedSelector
            tableId: VarietySyringeScav
            weight: 0.75
          - !type:NestedSelector
            tableId: VarietyPillCanisterScav
            weight: 0.75
          - id: Defibrillator
            weight: 0.1
