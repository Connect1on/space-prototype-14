- type: entity
  id: BoxMedicalRandom
  name: медицинский ящик
  parent: BaseStorageItem
  description: Медицинский ящик
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_red.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_red.rsi
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,4,4
    storageOpenSound: /Audio/Items/toolbox_open.ogg
    storageCloseSound: /Audio/Items/toolbox_close.ogg
    storageInsertSound: /Audio/Items/toolbox_insert.ogg
    storageRemoveSound: /Audio/Items/toolbox_remove.ogg
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        # Random lighting item GroupSelector
        - !type:GroupSelector
          rolls: 2
          children:
          - id: Gauze6
            weight: 0.75
          - id: Brutepack6
          - id: Ointment6
            weight: 0.9
          - id: PillCanisterTricordrazine
            weight: 0.85
          - id: PillCanisterDexalin
            weight: 0.6
          - id: SyringeInaprovaline
            weight: 0.6
          - id: PillCanisterBicaridine
            weight: 0.5
          - id: PillCanisterDermaline
            weight: 0.5
          - id: SyringeBicaridine
            weight: 0.5
          - id: SyringeDermaline
            weight: 0.5
          - id: SyringeSaline
            weight: 0.4
          - id: Bloodpack
            weight: 0.25
          - id: FoodSnackNutribrick
            weight: 0.25
          - id: DisposableSyringeHeroin
            weight: 0.15
          - id: Defibrillator
            weight: 0.1
