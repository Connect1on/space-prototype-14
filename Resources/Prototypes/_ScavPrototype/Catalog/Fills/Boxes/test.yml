- type: entity
  id: CapsuleRandomTest
  name: капсула тест
  parent: BaseStorageItem
  description: капсула тест с припасами, такая капсула лучше всех подходит для перевозки снаряжения. Но никто не гарантирует, что кто-то вновь не забил её различным хламом.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_red.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_red.rsi
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,2,7
    storageOpenSound: /Audio/Items/toolbox_open.ogg
    storageCloseSound: /Audio/Items/toolbox_close.ogg
    storageInsertSound: /Audio/Items/toolbox_insert.ogg
    storageRemoveSound: /Audio/Items/toolbox_remove.ogg
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        # Random lighting item GroupSelector
        - !type:GroupSelector
          rolls: 2
          children:
          - !type:NestedSelector
            tableId: VarietyInstrumentScav
