- type: entity
  id: BoxFoodRandom
  name: ящик
  parent: BaseStorageScavSpecial
  description: Обычный ящик со снабжением, возможно в нём ещё остались полезные инструменты или еда.
  components:
  - type: Sprite
    sprite: _ScavPrototype/Objects/Structures/Furniture/box.rsi
    state: icon
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,5,5
    storageOpenSound: /Audio/Items/toolbox_open.ogg
    storageCloseSound: /Audio/Items/toolbox_close.ogg
    storageInsertSound: /Audio/Items/toolbox_insert.ogg
    storageRemoveSound: /Audio/Items/toolbox_remove.ogg
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        # Random lighting item GroupSelector
        - !type:GroupSelector
          rolls: 2
          children:
          - !type:NestedSelector
            tableId: VarietyFoodAndWater
          - !type:NestedSelector
            tableId: VarietyBaseMedical
          - !type:NestedSelector
            tableId: VarietyInstrumentScav
            weight: 0.5
